name: Published Login Health
on:
  push:
    branches: [diagnose/login-runtime-2026-11-16]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/published-login-health.mjs
