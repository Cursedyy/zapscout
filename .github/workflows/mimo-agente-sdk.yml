name: MiMo Agent SDK

on:
  push:
    branches: [mimo/ai-sdk-diagnostico]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/mimo-agente*'
      - 'src/lib/mimo-whatsapp*'
      - 'src/components/mimo-agente*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/mimo-agente-sdk.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Agent and SDK contract tests
        run: bunx vitest run --config vitest.agente.config.ts --configLoader runner
      - name: TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Production build
        run: bunx vite build
