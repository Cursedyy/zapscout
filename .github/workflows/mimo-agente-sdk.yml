name: MiMo Agent SDK

on:
  push:
    branches: [mimo/ai-sdk-diagnostico]

# Temporary branch-only permission to resolve the dependency lock before review.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Resolve dependency lock on isolated branch
        run: |
          bun install --lockfile-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock MiMo AI SDK dependencies'
            git push origin HEAD:mimo/ai-sdk-diagnostico
          fi
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Agent and SDK contract tests
        run: bunx vitest run --config vitest.agente.config.ts --configLoader runner
      - name: TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Production build
        run: bunx vite build
