name: MiMo attendance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/mimo-agente*'
      - 'src/lib/uazapi*'
      - 'docs/migracoes-preparadas/mimo-agente*'
      - 'docs/migracoes-preparadas/mimo-whatsapp-nome-curto.sql'
      - 'drizzle/migrations/**'
      - '.github/workflows/mimo-atendimento.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx vitest run --config vitest.agente.config.ts --configLoader runner
      - run: bunx vite build
      - run: bunx tsc --noEmit --pretty false

